[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nmranalyzer"
version = "1.4.0"
description = "A desktop viewer and analyser for 1D and 2D NMR spectra, standard library only"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Jongsu Lim", email = "imjongsu1102@gmail.com" }]
keywords = ["NMR", "spectroscopy", "chemistry", "Bruker", "JCAMP-DX", "SMILES"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jongsu-king/nmr-analyzer"
Issues = "https://github.com/jongsu-king/nmr-analyzer/issues"

[project.gui-scripts]
nmr-analyzer = "nmranalyzer.app:main"

[tool.setuptools]
packages = ["nmranalyzer"]
